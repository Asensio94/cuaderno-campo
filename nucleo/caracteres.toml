# Caracteres macroscópicos de campo: lo que se apunta delante del ejemplar y que la foto no
# recoge —el viraje al corte, el olor, la esporada, el látex— o recoge mal —el himenóforo por
# debajo, el anillo, la volva enterrada—. Un modelo de imagen no los tendrá nunca; quien está
# allí, sí. Son la parte de la observación que más pesa en una determinación de hongos.
#
# Van dentro de `dwc:dynamicProperties` de la ocurrencia, bajo la clave del grupo:
#
#   {"hongo": {"himenoforo": "laminas", "viraje": "azul", "viraje_intensidad": "fuerte"}}
#
# Es un campo `json`, y el pliegue no fusiona por dentro de un json: un parche
# (`ocurrencia.enmendada`) sustituye el objeto entero. El cliente manda siempre el conjunto
# completo de caracteres, no el que cambió.
#
# Son descriptores morfológicos, no un juicio. Aquí no hay ni habrá nada que diga qué se hace
# con el ejemplar (restricción 4; pruebas/test_lexico_prohibido.py recorre también este fichero).
#
# Las claves son las que van al registro: ASCII, minúsculas, sin acentos. Las etiquetas son lo
# que ve quien apunta. Cambiar una clave es cambiar el dato; cambiar una etiqueta, no.
#
# De este fichero se generan, y NUNCA se editan a mano:
#   nucleo/generado/caracteres.ts
#   nucleo/generado/caracteres.py

