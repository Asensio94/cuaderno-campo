# Registro de tipos de suceso — segunda mitad de la fuente única.
#
# El pliegue (ADR-0001 §4.4) es un intérprete sobre este fichero, no una función por tipo.
# Eso es lo que hace alcanzable la prueba de conformidad entre Python y TypeScript: ambas
# implementaciones interpretan la misma tabla en vez de reimplementar la misma lógica.
#
# Convención que elimina dos clases enteras de inconsistencia:
#   - la clave del sujeto NO va en la carga: es `suceso.sujeto_id`
#   - cdc:cuadernoID NO va en la carga: es `suceso.cuaderno_id`
# Así una carga no puede contradecir a su propio sobre.
#
# modos:
#   completo -> crea la fila. Exige los campos requeridos de la clase, aplica predeterminados.
#   parche   -> actualiza solo los campos presentes. Último en escribir gana, por orden de hlc.
#   anexar   -> añade elementos a un campo de tipo json que contiene una lista.
#
# `fija` son valores que impone el propio tipo de suceso y que la carga no puede sobrescribir:
# es lo que convierte «retractada» en un suceso con intención en vez de un parche cualquiera.

version = 1

# --- Cuaderno -------------------------------------------------------------------------
[[tipos]]
tipo = "cuaderno.declarado"
tipo_version = 1
sujeto = "cuaderno"
clase = "Cuaderno"
modo = "completo"

[[tipos]]
tipo = "cuaderno.enmendado"
tipo_version = 1
sujeto = "cuaderno"
clase = "Cuaderno"
modo = "parche"

